<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoorNotesAI</title>

  <style>
    body{
      margin:0;
      padding:0;
      background:#0f172a;
      font-family:Arial, sans-serif;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .chat-box{
      width:90%;
      max-width:500px;
      background:#111827;
      border-radius:20px;
      padding:20px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    #messages{
      height:300px;
      overflow-y:auto;
      border-radius:10px;
      padding:10px;
      background:#1e293b;
      margin-bottom:15px;
    }

    .msg{
      margin:10px 0;
      padding:10px;
      border-radius:10px;
    }

    .user{
      background:#2563eb;
      text-align:right;
    }

    .bot{
      background:#374151;
    }

    .input-area{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="chat-box">
    <h1>🤖 NoorNotesAI</h1>

    <div id="messages">
      <div class="msg bot">👋 Hello! I am NoorNotesAI.</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask anything..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {

      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");

      const userText = input.value;

      if(!userText) return;

      messages.innerHTML += `
        <div class="msg user">${userText}</div>
      `;

      input.value = "";

      try{

        const response = await fetch("/chat", {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            message:userText
          })
        });

        const data = await response.json();

        messages.innerHTML += `
          <div class="msg bot">${data.reply}</div>
        `;

      }catch(error){

        messages.innerHTML += `
          <div class="msg bot">AI Error</div>
        `;

      }

      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
