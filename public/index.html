<!DOCTYPE html>
<html>
<head>
  <title>NoorNotesAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background:#0b1020;color:white;font-family:sans-serif;padding:20px;">

<h1>👋 Hello! I am NoorNotesAI.</h1>

<input id="prompt" placeholder="Ask anything..."
style="width:70%;padding:10px;">

<button onclick="sendMessage()">Send</button>

<div id="chat" style="margin-top:20px;"></div>

<script>
async function sendMessage() {

  const prompt =
    document.getElementById("prompt").value;

  const res = await fetch("/ai", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ prompt })
  });

  const data = await res.json();

  document.getElementById("chat").innerHTML += `
    <p><b>You:</b> ${prompt}</p>
    <p><b>AI:</b> ${data.reply}</p>
  `;
}
</script>

</body>
</html>
